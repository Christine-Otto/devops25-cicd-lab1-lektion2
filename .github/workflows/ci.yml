
name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera pytest
        run: python -m pip install pytest

      - name: Kör tester
        run: python -m pytest -v
